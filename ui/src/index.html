<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RTerm</title>
    <link rel="stylesheet" href="__RTERM_PREFIX__/xterm.css" />
    <script src="__RTERM_PREFIX__/xterm.js"></script>
    <script src="__RTERM_PREFIX__/addon-fit.js"></script>
    <link rel="stylesheet" href="__RTERM_PREFIX__/style.css" />
  </head>

  <body>
    <div id="session-tabs"><button id="new-session" type="button">+ New session</button></div>
    <div id="auth">
      <h1>Enter 6-Digit Code</h1>
      <div>
        <input type="number" id="digit1" class="digit-input" maxlength="1" autocomplete="off" />
        <input type="number" id="digit2" class="digit-input" maxlength="1" autocomplete="off" />
        <input type="number" id="digit3" class="digit-input" maxlength="1" autocomplete="off" />
        <input type="number" id="digit4" class="digit-input" maxlength="1" autocomplete="off" />
        <input type="number" id="digit5" class="digit-input" maxlength="1" autocomplete="off" />
        <input type="number" id="digit6" class="digit-input" maxlength="1" autocomplete="off" />
      </div>
      <div id="result"></div>
    </div>
    <div id="provider-select">
      <div class="provider-card">
        <div class="provider-row">
          <label class="provider-field">
            <span>Target</span>
            <select id="target-select"></select>
          </label>
          <label class="provider-field">
            <span>User</span>
            <select id="user-select"></select>
          </label>
        </div>
        <div id="provider-error"></div>
        <button id="connect-provider" type="button">Connect</button>
      </div>
    </div>
    <button
      id="transfer-toggle"
      type="button"
      aria-label="File transfers"
      title="File transfers"
      aria-expanded="false"
    >
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M7 3v12"></path>
        <path d="m3 11 4 4 4-4"></path>
        <path d="M17 21V9"></path>
        <path d="m13 13 4-4 4 4"></path>
      </svg>
    </button>
    <div id="transfer-panel">
      <button id="transfer-close" type="button" aria-label="Close transfers">×</button>
      <div class="transfer-section">
        <strong>Upload file</strong>
        <input id="upload-file" type="file" />
        <input id="upload-path" type="text" placeholder="Remote destination path or folder" />
        <button id="upload-button" type="button">Upload</button>
      </div>
      <div class="transfer-section">
        <strong>Download file</strong>
        <input id="download-path" type="text" placeholder="Remote source path" />
        <button id="download-button" type="button">Download</button>
      </div>
      <div id="transfer-status" role="status" aria-live="polite"></div>
    </div>
    <div id="terminal"></div>
    <script type="module" src="__RTERM_PREFIX__/script.js"></script>
  </body>
</html>
